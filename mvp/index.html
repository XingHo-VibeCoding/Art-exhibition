        galleryBackdrop.classList.remove('is-changing');
        void galleryBackdrop.offsetWidth;
        galleryBackdrop.classList.add('is-changing');
        window.setTimeout(function(){ galleryBackdrop.classList.remove('is-changing'); }, 1100);
      }
      renderFloor(true);
    }, REDUCED ? 0 : 260);

    window.setTimeout(function(){ shifting = false; }, REDUCED ? 60 : 900);
  }

  /* ========================================================================
     显影语法 · 「刷子刷出」（DESIGN_V5 §3 // D6）
     ------------------------------------------------------------------------
     · 一次连续的手部动作，从无到有，只此一次；单方向（左→右）
     · 手法：把画心窗竖切成 n 条「刷痕」，按序号递增收刷 = 分段错峰的遮蔽
     · 边缘：不用 filter 做毛边（性能 / 兼容风险），
       改用【分段矩形制造参差】—— 前沿一道带斜角的羽化 + 延迟抖动 + 宽度不一
     · ★ 关键性质：遮蔽层只挡不改、不碰画面像素 → 对任何色彩风格都安全
       （这正是它比「错版」稳的地方：柔和的作品不会被照成故障画面）
     ====================================================================== */
  /* ========================================================================
     聚焦 F-05 · GSAP 空间补间
     ====================================================================== */
  var focusMotion = null;
  function matRect(index){
    var card = $$('.plate')[index];
    var mat = card && card.querySelector('.mat');
    if (!mat) return null;
    var rect = mat.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return { left:rect.left, top:rect.top, width:rect.width, height:rect.height };
  }
  /* 飞行【起点】：展墙上那张作品图片本身。
     第 14 节下 .win 就是整张图（width:100% + height:auto），所以它的矩形
     已经是图片的真实比例，不需要再按 object-fit 换算。 */
  function cardRect(index){
    var card = $$('.plate')[index];
    var win  = card && card.querySelector('.win');
    if (!win) return matRect(index);            /* 退化：拿不到画心窗才用整张卡 */
    var rect = win.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return { left:rect.left, top:rect.top, width:rect.width, height:rect.height };
  }
  /* 起飞时只藏那张图、不藏整张卡：卡纸留在墙上，作品自己离开。 */
  function sourceWin(index){
    var card = $$('.plate')[index];
    return card ? card.querySelector('.win') : null;
  }
  /* 展墙上那张图的原始像素尺寸 —— 用来算它在槽位里的落点。 */
  function naturalSize(index){
    var card = $$('.plate')[index];
    var img  = card && card.querySelector('.win img');
    if (!img || !img.naturalWidth || !img.naturalHeight) return { w:0, h:0 };
    return { w:img.naturalWidth, h:img.naturalHeight };
  }
  /* 飞行【终点】：图片落进校样台槽位后的真实矩形。
     槽位里是 object-fit:contain，图片会按原比例居中并留边 ——
     若直接拿槽位矩形当终点，飞行末段会被「撑满」一次，出现一次轻微形变。
     换算成居中矩形后，起点与终点同为图片比例，全程纯等比缩放。 */
  function slotRect(natW, natH){
    var box = focusArt.getBoundingClientRect();
    if (!box.width || !box.height) return null;
    if (!natW || !natH) return { left:box.left, top:box.top, width:box.width, height:box.height };
    var s = Math.min(box.width / natW, box.height / natH);
    var w = natW * s, h = natH * s;
    return { left:box.left + (box.width - w) / 2, top:box.top + (box.height - h) / 2, width:w, height:h };
  }
  function rectOnScreen(rect){
    return !!rect && rect.left + rect.width > 0 && rect.left < window.innerWidth &&
      rect.top + rect.height > 0 && rect.top < window.innerHeight;
  }
  function createFocusFlight(work, from, to){
    var flight = document.createElement('div');
    flight.className = 'focus-flight';
    flight.setAttribute('aria-hidden', 'true');
    var image = document.createElement('img');
    image.src = work.img;
    image.alt = '';
    flight.appendChild(image);
    document.body.appendChild(flight);
    /* padding 一律为 0：校样台的画心槽是 padding:0，
       飞行层留一点内边距就会在交接那帧露出一条缝。 */
    flight.style.padding = '0';
    window.gsap.set(flight, {
      left:to.left, top:to.top, width:to.width, height:to.height,
      transformOrigin:'0 0',
      x:from.left - to.left, y:from.top - to.top,
      scaleX:from.width / to.width, scaleY:from.height / to.height
    });
    return flight;
  }
  /* 复位：把所有被时间轴改过的内联样式交还回去。
     少了这一步，第二次打开聚焦会带着上一次的 opacity/visibility 残留。 */
  function clearFocusMotion(){
    if (focusMotion){ focusMotion.kill(); focusMotion = null; }
    $$('.focus-flight').forEach(function(flight){ flight.remove(); });
    focusArt.classList.remove('is-moving');
    focusEl.style.opacity = '';
    focusArt.style.opacity = '';
    focusArt.querySelectorAll('.layer').forEach(function(layer){ layer.style.visibility = ''; });
    if (window.gsap){
      window.gsap.set(
        [focusEl, focusArt, focusStage].concat($$('.focus-info, .close-btn, .nav-btn, .plate .win')),
        { clearProps:'opacity,visibility,transform' }
      );
    }
  }

  /* 校样台的「装裱配件」：关闭按钮、左右箭头。
     说明栏 .focus-info 在 .focus-stage 内部，随衬托背景一起进场，不必单列。 */
  function focusChrome(){ return $$('.close-btn, .nav-btn'); }

  /* 聚焦面板的文字。animate=true 走错乱显现；否则直接给终态。 */
  function setFocusText(i, animate){
    var works = state.series.works;
     var w = works[i];
    if (!w) return;
    cancelAllScrambles();
    if (!animate){
      $('#focusName').textContent        = w.name;
      $('#focusSeries').textContent      = state.series.name;
      $('#focusCount').textContent       = 'No. ' + pad(i + 1) + ' / ' + pad(works.length);
      $('#focusVerse').textContent       = w.verse || '';
      $('#focusDescription').textContent = w.note || '';
      return;
    }
    /* 四行错峰起跑：标题先到，说明最后落定 */
    scrambleText($('#focusName'),        w.name,                                          { delay:0,   duration:FOCUS_MOTION.text * 1000 });
    scrambleText($('#focusSeries'),      state.series.name,                               { delay:70,  duration:420 });
    scrambleText($('#focusCount'),       'No. ' + pad(i + 1) + ' / ' + pad(works.length), { delay:130, duration:400 });
    scrambleText($('#focusVerse'),       w.verse || '',                                   { delay:170, duration:620 });
    scrambleText($('#focusDescription'), w.note || '',                                     { delay:190, duration:760 });
  }

  function paintFocus(i, keepPrevious){
    var works = state.series.works;
    var w     = works[i];
    if (!w) return;

    var layer = document.createElement('div');
    layer.className = 'layer';
    layer.innerHTML = '<img src="' + w.img + '" alt="' + w.name + '">';

    var olds = $$('#focusArt .layer');
    focusArt.appendChild(layer);
    if (!keepPrevious) olds.forEach(function(old){ old.remove(); });

    setFocusText(i, false);          /* 先落终态，错乱显现由时间轴另行触发 */
    return layer;
  }

  /* 关闭后回到原位（AC-37）用的滚动位置 */
  var savedScroll = 0;
  function restoreScroll(){ window.scrollTo(0, savedScroll); }

  /* ========================================================================
     聚焦进入 · 四拍（Day 10）
     ------------------------------------------------------------------------
     ① 遮罩压暗  展墙被推远，但作品还没动
     ② 作品飞行  从展墙的画心窗，飞到校样台中央的画心槽（同为 2:3，纯等比缩放）
     ③ 衬托装裱  参考图模板刷上来，把已经落位的作品「装裱」起来
     ④ 文字归位  先一屏乱码，再逐字归位

     顺序不能反：先让作品被看见，再给它一个环境，最后才解释它是什么。
     反过来看——模板先出现就等于先给一个空相框，作品再掉进去，观感是「填表」。
     ====================================================================== */
  function openFocus(i){
    if (!state.series.works[i]) return;
    state.open = true;
    state.focusIndex = i;
    cancelAllScrambles();

    var gsap   = window.gsap;
    var origin = cardRect(i);                 /* 展墙上那张作品图 */
    var source = sourceWin(i);                /* 起飞时只藏那张图 */
    var nat    = naturalSize(i);

    focusEl.classList.add('open');
    focusEl.dataset.mode = state.series.id === 'theology' ? 'theology' : 'direct';
    document.body.style.overflow = 'hidden';
    /* 只清画心层。衬托背景挂在 .focus-stage 上，是常驻节点，不能被抹掉 */
    $$('#focusArt .layer').forEach(function(old){ old.remove(); });
    var layer = paintFocus(i);
    savedScroll = window.scrollY;

    var destination = slotRect(nat.w, nat.h);
    var animate = !REDUCED && gsap && focusStage && origin && destination && rectOnScreen(origin);

    if (!animate){
      /* 没有 GSAP 或系统要求低动态时，也要隐藏原卡片，避免它留在聚焦层后方造成重影。 */
      if (source) source.style.opacity = '0';
      setFocusText(i, false);                 /* 无动画：直接给终态，不做乱码 */
      return;
    }

    /* 交给 GSAP 之后，.focus 上那套 CSS transition 必须停掉，
       否则每一帧的内联 opacity 都会被 CSS 再过渡一次，动画会拖尾。 */
    focusEl.classList.add('motion');

    /* 起始态：遮罩、衬托背景、画心、配件全部先隐身，交给时间轴逐拍放出 */
    /* 聚焦层和展示背景保持可见；最终画框先隐藏，避免与飞行层重影。 */
    gsap.set(focusEl,      { autoAlpha:1 });
    gsap.set(focusStage,   { autoAlpha:1, scale:1.05 });
    gsap.set(layer,        { autoAlpha:0, display:'none' });
    gsap.set(focusChrome(), { autoAlpha:1 });

    var flight = createFocusFlight(state.series.works[i], origin, destination);
    focusArt.classList.add('is-moving');
    if (source) gsap.set(source, { autoAlpha:0 });

    var tFly   = FOCUS_MOTION.veil * .4;              /* 遮罩压到一半就起飞 */
    var tStage = tFly + FOCUS_MOTION.fly;             /* 落位 → 装裱 + 文字 */

    focusMotion = gsap.timeline({
      defaults:{ overwrite:'auto' },
      onComplete:function(){
        flight.remove();
        focusArt.classList.remove('is-moving');
        if (source) gsap.set(source, { clearProps:'opacity,visibility' });
        gsap.set(layer, { clearProps:'opacity,visibility' });
        focusMotion = null;
      }
    })
      /* ① 墙退半步：展墙被推远，作品还没动 */
      .to(focusEl, { autoAlpha:1, duration:FOCUS_MOTION.veil, ease:EASE.reveal }, 0)

      /* ② 作品从展墙原位飞到校样台正中。两端同为图片比例 → 纯等比缩放 */
      .to(flight, {
        x:0, y:0, scaleX:1, scaleY:1,
        duration:FOCUS_MOTION.fly, ease:EASE.press
      }, tFly)
      /* 飞行层不再从半透明起步，图片亮度保持稳定。 */

      /* ③ 衬托背景刷上，把已经落位的作品装裱起来 */
      .to(focusStage, { autoAlpha:1, scale:1, duration:FOCUS_MOTION.stage, ease:EASE.reveal }, tStage)
      .to(focusChrome(), { autoAlpha:1, duration:FOCUS_MOTION.stage * .8, ease:EASE.reveal }, tStage + .1)

      /* ④ 交接：飞行层让位给真正的画心层；文字同步以乱码起手，再逐字归位 */
      .call(function(){
        focusArt.classList.remove('is-moving');
        gsap.set(layer, { autoAlpha:1, display:'block' });
        setFocusText(i, true);
      }, null, tStage);
  }

  /* 关闭 = 进入的逆序：装裱先退（作品重新成为主角），作品飞回墙上，遮罩最后收。
     原来的写法只让遮罩淡出，作品原地消失 —— 那是「关掉一个弹窗」，不是「把画送回墙上」。 */
  function closeFocus(){
    /* 进入动画还没播完就按了关闭：先接管并清场，再走退出。
       旧逻辑是直接 return，结果 ESC 在开场那一秒是全失灵的。 */
    if (focusMotion) clearFocusMotion();
    cancelAllScrambles();

    var gsap        = window.gsap;
    var nat         = naturalSize(state.focusIndex);
    var origin      = slotRect(nat.w, nat.h);         /* 校样台上图片的真实矩形 */
    var destination = cardRect(state.focusIndex);     /* 展墙上原来那张图 */
    var source      = sourceWin(state.focusIndex);
    var work        = state.series.works[state.focusIndex];

    if (!REDUCED && gsap && origin && destination && rectOnScreen(destination) && work){
      var flight = createFocusFlight(work, origin, destination);
      focusArt.classList.add('is-moving');            /* 静态画心让位给飞行层 */
      if (source) gsap.set(source, { autoAlpha:0 });
      var chrome = focusChrome();
      focusMotion = gsap.timeline({
        defaults:{ overwrite:'auto' },
        onComplete:function(){
          flight.remove();
          if (source) gsap.set(source, { clearProps:'opacity,visibility' });
          finishCloseFocus();
        }
      })
        /* ① 衬托背景与配件先退，作品重新变成画面主角 */
        .to([focusStage].concat(chrome), { autoAlpha:0, duration:.24, ease:EASE.reveal }, 0)
        /* ② 作品飞回展墙原位 */
        .to(flight, { x:0, y:0, scaleX:1, scaleY:1, duration:.64, ease:EASE.lift }, .06)
        /* 飞行层保持原亮度，完成后直接移除。 */
        /* ③ 遮罩最后收 */
        .to(focusEl, { autoAlpha:0, duration:.32, ease:EASE.reveal }, .48);
      return;
    }
    if (!REDUCED && gsap){
      focusMotion = gsap.timeline({
        defaults:{ overwrite:'auto' },
        onComplete:function(){ focusMotion = null; finishCloseFocus(); }
      }).to(focusArt, { scale:.96, autoAlpha:0, duration:.3, ease:EASE.lift }, 0)
        .to(focusEl, { autoAlpha:0, duration:.3 }, 0);
      return;
    }
    finishCloseFocus();
  }

  function finishCloseFocus(){
    state.open = false;
    focusEl.classList.remove('open');
    delete focusEl.dataset.mode;
    document.body.style.overflow = '';
    clearFocusMotion();
    /* 关闭后不保留聚焦副本，下一次打开由当前作品重新生成。 */
    $$('#focusArt .layer').forEach(function(layer){ layer.remove(); });
    $$('.plate .win').forEach(function(win){ win.style.opacity = ''; win.style.visibility = ''; });
    focusArt.style.transform = '';
    focusArt.style.transformOrigin = '';
    restoreScroll();
  }

  function step(d){
    var n = state.series.works.length;
    if (!n || !state.open || focusMotion) return;

    var oldIndex = state.focusIndex;
    var nextIndex = (oldIndex + d + n) % n;
    var oldWork = state.series.works[oldIndex];
    var nextWork = state.series.works[nextIndex];
    /* 换印时两端各有自己的落点：旧作从它在槽位里的矩形飞回展墙，
       新作从展墙飞到自己的落点。两件作品比例不同时，各算各的才不会形变。 */
      var oldNat     = naturalSize(oldIndex);
    var nextNat    = naturalSize(nextIndex);
    var oldSlot    = slotRect(oldNat.w, oldNat.h);
    var nextSlot   = slotRect(nextNat.w, nextNat.h);
    var oldOrigin  = cardRect(oldIndex);
    var nextOrigin = cardRect(nextIndex);
    var canFly = !REDUCED && window.gsap && window.innerWidth > 760 &&
      rectOnScreen(oldOrigin) && rectOnScreen(nextOrigin);

    state.focusIndex = nextIndex;
    var newLayer = paintFocus(nextIndex, true);
    setFocusText(nextIndex, true);               /* 换印时文字同样走一遍错乱归位 */
    var oldLayers = Array.prototype.slice.call(focusArt.querySelectorAll('.layer'))
      .filter(function(layer){ return layer !== newLayer; });

    if (REDUCED || !window.gsap){
      oldLayers.forEach(function(layer){ layer.remove(); });
      return;
    }

    if (canFly){
      var outgoing = createFocusFlight(oldWork, oldSlot, oldOrigin);
      var incoming = createFocusFlight(nextWork, nextOrigin, nextSlot);
      var oldCard = sourceWin(oldIndex);
      var nextCard = sourceWin(nextIndex);
      if (oldCard) window.gsap.set(oldCard, { autoAlpha:0 });
      if (nextCard) window.gsap.set(nextCard, { autoAlpha:0 });
      focusArt.classList.add('is-moving');
      focusMotion = window.gsap.timeline({
        defaults:{ overwrite:'auto' },
        onComplete:function(){
          outgoing.remove();
          incoming.remove();
          if (oldCard) window.gsap.set(oldCard, { clearProps:'opacity,visibility' });
          if (nextCard) window.gsap.set(nextCard, { clearProps:'opacity,visibility' });
          oldLayers.forEach(function(layer){ layer.remove(); });
          focusArt.classList.remove('is-moving');
          focusMotion = null;
        }
      });
      focusMotion
        .to(outgoing, { x:0, y:0, scaleX:1, scaleY:1, duration:.72, ease:EASE.lift }, 0)
        .to(incoming, { x:0, y:0, scaleX:1, scaleY:1, duration:.82, ease:EASE.press }, .04);
      return;
    }

    var sign = d > 0 ? 1 : -1;
    focusMotion = window.gsap.timeline({
      defaults:{ overwrite:'auto' },
      onComplete:function(){
        oldLayers.forEach(function(layer){
          layer.removeAttribute('style');
          layer.remove();
        });
        newLayer.removeAttribute('style');
        focusMotion = null;
      }
    });
    focusMotion
      .fromTo(oldLayers, {
        x:0, autoAlpha:1, clipPath:'inset(0 0 0 0)'
      }, {
        x:-sign * 46, autoAlpha:1, clipPath:sign > 0 ? 'inset(0 100% 0 0)' : 'inset(0 0 0 100%)',
        duration:.38, ease:EASE.lift
      }, 0)
      .fromTo(newLayer, {
        x:sign * 46, autoAlpha:1, clipPath:sign > 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)'
      }, {
        x:0, autoAlpha:1, clipPath:'inset(0 0 0 0)',
        duration:.62, ease:EASE.press
      }, .08);
  }

  /* ========================================================================
     事件绑定
     ====================================================================== */
  $('#nextBtn').addEventListener('click', function(){ step(1); });
  $('#prevBtn').addEventListener('click', function(){ step(-1); });
  $('#closeBtn').addEventListener('click', closeFocus);

  document.addEventListener('keydown', function(e){
    if (!state.open) return;
    if (e.key === 'Escape')     { closeFocus(); }
    if (e.key === 'ArrowRight') { step(1); }
    if (e.key === 'ArrowLeft')  { step(-1); }
  });

  // 移动端横向滑动（AC-70）
  var touchX = 0;
  focusEl.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, { passive:true });
  focusEl.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 42) step(dx < 0 ? 1 : -1);
  }, { passive:true });

  // 顶栏吸顶
  window.addEventListener('scroll', function(){
    topbar.classList.toggle('stuck', window.scrollY > 40);
  }, { passive:true });

  /* ========================================================================
     GSAP 揭幕：压合 720ms → 压印 120ms → 收束 360ms。
     本地库加载失败或减少动态时直接进入完整静态终态，不让动效挡住内容。
     ====================================================================== */
  function finishGalleryEntrance(){
    if (galleryTimeline) galleryTimeline.kill();
    galleryTimeline = null;
    galleryRevealed = true;
    if (window.gsap){
      window.gsap.set([
        '.wordmark', '.series li', '.exhibition-kicker', '.exhibition-title',
        '.exhibition-note', '.plate--lead .mat', '.plate--lead .win',
        '.plate--lead .press-mark', '.plate--right', '.plate--right-low', '.plate--closing'
      ], { clearProps:'transform,opacity,visibility,clipPath' });
    }
  }
  function skipUnveil(){
    if (galleryRevealed) return;
    unveilEnded = true;
    if (unveilTimeline) unveilTimeline.kill();
    unveilTimeline = null;
    unveil.classList.add('skip','done');
    unveil.style.display = 'none';
    finishGalleryEntrance();
  }

  function playGalleryEntrance(){
    if (galleryRevealed || galleryTimeline || REDUCED || !window.gsap) return;
    registerGsapPlugins();
    galleryTimeline = window.gsap.timeline({
      defaults:{ overwrite:'auto' },
      onComplete:finishGalleryEntrance
    });
    galleryTimeline
      .fromTo('.wordmark',
        { x:-12, clipPath:'inset(0 100% 0 0)' },
        { x:0, clipPath:'inset(0 0% 0 0)', duration:.46, ease:EASE.press }, 0
      )
      .fromTo('.series li',
        { y:-18, autoAlpha:0 },
        { y:0, autoAlpha:1, duration:.42, stagger:.075, ease:EASE.lift }, .08
      )
      .fromTo('.exhibition-kicker',
        { clipPath:'inset(0 100% 0 0)' },
        { clipPath:'inset(0 0% 0 0)', duration:.42, ease:EASE.squeegee }, .06
      )
      .fromTo('.exhibition-title',
        { y:42, autoAlpha:0, clipPath:'inset(0 0 100% 0)' },
        { y:0, autoAlpha:1, clipPath:'inset(0 0 0% 0)', duration:.82, ease:EASE.press }, .14
      )
      .fromTo('.exhibition-note',
        { y:12, autoAlpha:0 },
        { y:0, autoAlpha:1, duration:.48, ease:EASE.reveal }, .3
      )
      .fromTo('.plate--lead .mat',
        { y:34, scale:.97, autoAlpha:0 },
        { y:0, scale:1, autoAlpha:1, duration:1.02, ease:EASE.press }, .02
      )
      .fromTo('.plate--lead .win',
        { clipPath:'inset(0 100% 0 0)' },
        { clipPath:'inset(0 0% 0 0)', duration:1.12, ease:EASE.squeegee }, .12
      )
      .fromTo('.plate--lead .press-mark',
        { scaleX:0, autoAlpha:.9 },
        { scaleX:1, autoAlpha:0, duration:.28, ease:EASE.register }, .68
      )
      .fromTo('.plate--right, .plate--right-low, .plate--closing',
        { x:42, y:28, autoAlpha:0 },
        { x:0, y:0, autoAlpha:1, duration:.76, stagger:.22, ease:EASE.lift }, .5
      );
  }

  function playUnveil(){
    if (REDUCED || !window.gsap){
      unveil.style.display = 'none';
      finishGalleryEntrance();
      return;
    }
    unveil.style.display = '';
    unveil.classList.remove('done','skip');
    window.gsap.set(['.curtain.top','.curtain.bottom'], { yPercent:0 });
    window.gsap.set('.unveil-mark', { autoAlpha:0, scaleY:.08, y:8, filter:'blur(4px)' });
    window.gsap.set('.unveil-line', { scaleX:0 });
    unveilTimeline = window.gsap.timeline({
      defaults:{ overwrite:'auto' },
      onComplete:function(){
        unveil.style.display = 'none';
        unveilTimeline = null;
        playGalleryEntrance();
      }
    })
      .to('.unveil-mark', {
        autoAlpha:1, scaleY:1, y:0, filter:'blur(0px)',
        duration:.52, ease:EASE.press
      }, .18)
      .to('.unveil-line', { scaleX:1, duration:.56, ease:EASE.press }, .18)
      .to('.curtain.top', { yPercent:-102, duration:.86, ease:EASE.press }, .82)
      .to('.curtain.bottom', { yPercent:102, duration:.86, ease:EASE.press }, .82)
      .to('.unveil-mark', { autoAlpha:0, duration:.18 }, .94)
      .to('.unveil-line', { autoAlpha:0, duration:.18 }, .94);
  }

  /* 本地核心库负责动效；插件登记钩子保留，便于后续启用扩展。 */
  var gsapPluginNames = [];
  var registeredGsapPlugins = {};
  function registerGsapPlugins(){
    if (!window.gsap) return;
    var ready = [];
    gsapPluginNames.forEach(function(name){
      var plugin = window[name];
      if (plugin && !registeredGsapPlugins[name]){
        ready.push(plugin);
        registeredGsapPlugins[name] = true;
      }
    });
    if (ready.length) window.gsap.registerPlugin.apply(window.gsap, ready);
  }
  document.querySelectorAll('script[data-gsap-plugin]').forEach(function(script){
    script.addEventListener('load', registerGsapPlugins);
  });
  window.addEventListener('load', registerGsapPlugins);

  function waitForGsap(timeout){
    return new Promise(function(resolve){
      if (window.gsap){ resolve(true); return; }
      var settled = false;
      var request = new XMLHttpRequest();
      function finish(ok){
        if (settled) return;
        settled = true;
        window.removeEventListener('gsap:ready', ready);
        window.removeEventListener('gsap:failed', failed);
        request.onload = null;
        request.onerror = null;
        resolve(ok && !!window.gsap);
      }
      function ready(){ finish(true); }
      function failed(){ finish(false); }
      function loadLocalGsap(){
        if (settled || request.readyState !== 4) return;
        if (window.gsap){ finish(true); return; }
        if (request.status < 200 || request.status >= 300){ finish(false); return; }
        var script = document.createElement('script');
        script.text = request.responseText;
        document.head.appendChild(script);
        finish(!!window.gsap);
      }
      window.addEventListener('gsap:ready', ready, { once:true });
      window.addEventListener('gsap:failed', failed, { once:true });
      request.open('GET', 'vendor/gsap.min.js', true);
      request.onload = loadLocalGsap;
      request.onerror = function(){ finish(false); };
      request.send();
      window.setTimeout(function(){ finish(false); }, timeout);
    });
  }

  ['click','keydown','wheel','touchstart'].forEach(function(ev){
    window.addEventListener(ev, skipUnveil, { once:true, passive:true });
  });
  /* 静态模式不等待 GSAP、不启动背景 canvas，也不播放揭幕或入场时间轴。 */
  unveil.style.display = 'none';
  finishGalleryEntrance();

  /* ========================================================================
     初始化：锚点 / 记忆主题优先（AC-12 / AC-13）
     ====================================================================== */
  function boot(){
    ensureGsap();                     /* 本地库缺失时补一次 CDN，失败不影响静态浏览 */
    var hash  = (location.hash || '').replace('#','');
    var saved = null;
    try { saved = localStorage.getItem('art-exhibition-theme'); } catch(e){}
    var want = SERIES.filter(function(s){ return s.id === hash; })[0]
            || SERIES.filter(function(s){ return s.id === saved && s.works.length; })[0];

    if (want) state.series = want;
    document.body.dataset.theme = state.series.id;
    if (!hash) history.replaceState(null, '', '#' + state.series.id);

    buildNav();
    renderFloor(false);

    /* 调试开关：?focus=N 直接打开聚焦视图看第 N 张。
       只为方便肉眼验收与截图，不参与正常浏览，也不产生任何外部请求。 */
    var q = new URLSearchParams(location.search);
    if (q.has('focus')){
      var n = Math.max(0, Math.min(state.series.works.length - 1, parseInt(q.get('focus'), 10) || 0));
      skipUnveil();
      window.setTimeout(function(){ openFocus(n); }, 80);
    }
  }

  boot();
})();
</script>
</body>
